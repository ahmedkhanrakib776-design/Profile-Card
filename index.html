<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Creating profile card</title>
</head>
<body>
    <div class="profile-card">
    
        <div class="profile">
            <img class="image" src="Profile.jpg" alt="Profile Photo" >
        </div>

        <div class="text-data">
            <span class="name">Coding lab</span>
            <span class="job">Youtuber & Blogger</span>
        </div>

        <div class="media-buttons">
            <a href="#" class="link" id="fb"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" class="link" id="tw"><i class="fa-brands fa-twitter"></i></a>
            <a href="#" class="link" id="in"><i class="fa-brands fa-instagram"></i></i></a>
            <a href="#" class="link" id="yu"><i class="fa-brands fa-youtube"></i></i></a>
        </div>

        <div class="buttons">
            <button>Subscribe</button>
            <button>Message</button>
        </div>

        <div class="analytics">

            <div class="data">
            
            <span class="number"><i class="fa-regular fa-heart"></i>60k</span>
            
            <span class="number"><i class="fa-regular fa-comment"></i>20k</span>
            
            <span class="number"><i class="fa-solid fa-share"></i>12k</span>

            </div>

        </div>
        
    </div>
</body>
</html>
